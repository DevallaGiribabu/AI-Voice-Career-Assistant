<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>AI Voice Career Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 20px;
        background: radial-gradient(ellipse at 50% 0, #e4ecff 0, transparent 55%), #f5f7fb;
      }

      main { width: min(100%, 720px); margin: 0 auto; }

      header { margin-bottom: 28px; text-align: center; }

      h1 { margin: 0 0 10px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.045em; }

      header p { margin: 0; color: #5b6578; line-height: 1.6; }

      section {
        margin-top: 18px;
        padding: 24px;
        border: 1px solid #e3e8f1;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 36px #26395e0a;
      }

      h2 { margin: 0 0 16px; font-size: 1.1rem; }

      input[type="file"] {
        display: block;
        width: 100%;
        padding: 14px;
        border: 1px dashed #b7c3d6;
        border-radius: 12px;
        color: #48556b;
        background: #f9faff;
      }

      .hint { margin: 10px 0 0; color: #6a7487; font-size: 0.88rem; }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #315ee8;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: #244bc2; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }

      #status { min-height: 1.5em; margin: 14px 0 0; color: #48556b; }
      #status[data-error="true"] { color: #b42318; }
      [hidden] { display: none !important; }

      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
        line-height: 1.65;
      }

      @media (max-width: 520px) {
        body { padding: 32px 14px; }
        section { padding: 19px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AI Voice Career Assistant</h1>
        <p>Ask about career paths, learning roadmaps, projects, resumes, and interview preparation.</p>
      </header>

      <section aria-labelledby="upload-title">
        <h2 id="upload-title">Ask with your voice</h2>
        <form id="audio-form">
          <label for="audio">Choose an audio recording</label>
          <input id="audio" name="audio" type="file" accept="audio/*" required>
          <p class="hint">Maximum file size: 4 MiB.</p>
          <button id="submit" type="submit" disabled>Transcribe and get guidance</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="transcript-section" aria-labelledby="transcript-title" hidden>
        <h2 id="transcript-title">Your question</h2>
        <pre id="transcript"></pre>
      </section>

      <section id="guidance-section" aria-labelledby="guidance-title" hidden>
        <h2 id="guidance-title">Career guidance</h2>
        <pre id="guidance"></pre>
      </section>
    </main>

    <script>
      const form = document.querySelector("#audio-form");
      const audioInput = document.querySelector("#audio");
      const submitButton = document.querySelector("#submit");
      const status = document.querySelector("#status");

      audioInput.addEventListener("change", () => {
        submitButton.disabled = !audioInput.files.length;
      });

      async function post(url, options) {
        const response = await fetch(url, options);
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "The request could not be completed.");
        }
        return result;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const audio = audioInput.files[0];
        if (!audio) return;
        if (audio.size > 4 * 1024 * 1024) {
          status.dataset.error = "true";
          status.textContent = "Choose an audio file that is 4 MiB or smaller.";
          return;
        }

        submitButton.disabled = true;
        status.dataset.error = "false";
        document.querySelector("#transcript-section").hidden = true;
        document.querySelector("#guidance-section").hidden = true;

        try {
          status.textContent = "Transcribing your audio…";
          const formData = new FormData();
          formData.append("audio", audio);
          const transcription = await post("/api/transcribe", {
            method: "POST",
            body: formData,
          });
          document.querySelector("#transcript").textContent = transcription.transcript;
          document.querySelector("#transcript-section").hidden = false;

          status.textContent = "Preparing your career guidance…";
          const result = await post("/api/guidance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ transcript: transcription.transcript }),
          });
          document.querySelector("#guidance").textContent = result.guidance;
          document.querySelector("#guidance-section").hidden = false;
          status.textContent = "Your guidance is ready.";
        } catch (error) {
          status.dataset.error = "true";
          status.textContent = error.message || "Something went wrong. Please try again.";
        } finally {
          submitButton.disabled = !audioInput.files.length;
        }
      });
    </script>
  </body>
</html>
